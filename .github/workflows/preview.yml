name: Previews legibles

on:
  push:
    paths:
      - "**/*.pptx"
      - "**/*.docx"
      - "**/*.xlsx"
      - "**/*.pdf"
      - "!previews/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pypdf
        run: pip install pypdf

      - name: Generar Markdown
        run: python tools/preview.py

      - name: Instalar LibreOffice si falta
        run: |
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice
          fi

      - name: Generar PDF
        run: python tools/preview.py --pdf

      - name: Commit de previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          if git diff --cached --quiet; then
            echo "Sin cambios en previews"
          else
            git commit -m "docs: actualizar previews legibles"
            git push
          fi
